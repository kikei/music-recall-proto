# Builds the image on every merge to main and publishes it. The server pulls it
# from here, so nothing in this workflow needs access to the server: no SSH key
# is handed to GitHub, and the deployment is not reachable from outside.
name: publish

on:
  push:
    branches: [main]
  # Lets a build be re-run without an empty commit, e.g. after changing one of
  # the frontend variables below.
  workflow_dispatch:

# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at other code, which is how a compromised action reaches everything the
# workflow can touch -- here, the image the server will run.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # latest is what the server follows; the commit tag is what a
          # rollback names.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Vite compiles these into the bundle, so they are settled here rather
          # than on the server. They are public identifiers, not secrets, and
          # are held as repository variables.
          build-args: |
            VITE_LOGTO_ENDPOINT=${{ vars.VITE_LOGTO_ENDPOINT }}
            VITE_LOGTO_APP_ID=${{ vars.VITE_LOGTO_APP_ID }}
            VITE_LOGTO_RESOURCE=${{ vars.VITE_LOGTO_RESOURCE }}
