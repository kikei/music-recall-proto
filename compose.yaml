# Runs the app as one container with the database on a named volume. It listens
# on the host's loopback only: TLS and the public name belong to whatever proxy
# already fronts the machine, so nothing here has to know the domain.
services:
  app:
    build:
      context: .
      args:
        # Compiled into the frontend bundle at build time, so a change here
        # needs a rebuild, not a restart.
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT:?}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID:?}
        VITE_LOGTO_RESOURCE: ${VITE_LOGTO_RESOURCE:?}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - data:/data
    environment:
      # Read at run time. The issuer and audience must name the same tenant and
      # API resource the frontend was built against.
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
      # Encrypts the API keys accounts enter. Losing it means everyone re-enters
      # theirs; there is deliberately no recovery path.
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?}
      # Shared player keys, used for accounts that have not set their own.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    healthcheck:
      # Answers without touching the database, so it reports "serving" and not
      # "the data is fine".
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
